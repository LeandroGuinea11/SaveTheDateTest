<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Save the Date - Jacqueline & Mario</title>
    
    <link rel="icon" type="image/png" href="imagenes/footer-iniciales.png">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Bodoni+Moda:ital,wght@1,400&family=Poppins:wght@400;500;700&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            height: 100%;
            background-color: #1a1a1a; /* Fondo exterior elegante en PC */
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Poppins', sans-serif;
            overflow-x: hidden;
        }

        /* --- CONTENEDOR INTELIGENTE --- */
        .mobile-container {
            width: 100%;
            max-width: 430px;
            height: 100vh;
            position: relative;
            box-shadow: 0 0 40px rgba(0,0,0,0.6);
            background-color: #3b2219; 
            overflow-y: auto; 
            display: flex;
            flex-direction: column;
            scroll-behavior: smooth;
        }

        /* Ajuste especial para pantallas grandes (Computadoras/Tablets) */
        @media (min-height: 850px) and (min-width: 450px) {
            .mobile-container {
                max-height: 850px;
                border-radius: 12px; /* Bordes redondeados estéticos en PC */
            }
        }

        /* --- BOTÓN DE MÚSICA FLOTANTE --- */
        .music-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 100;
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            width: 42px;
            height: 42px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            transition: transform 0.3s ease, background 0.3s ease;
        }

        .music-btn:hover {
            transform: scale(1.08);
            background: rgba(255, 255, 255, 0.4);
        }

        .music-btn svg {
            width: 20px;
            height: 20px;
            fill: #ffffff;
            transition: fill 0.3s ease;
        }

        /* Cambio de color estético cuando la música está pausada o en zona blanca */
        .music-btn.black-style {
            background: rgba(59, 34, 25, 0.15);
            border: 1px solid rgba(59, 34, 25, 0.2);
        }
        .music-btn.black-style svg {
            fill: #3b2219;
        }

        /* --- VISTA 1: EL SOBRE (ELEMENTOS CENTRADOS) --- */
        .section-envelope {
            width: 100%;
            height: 100vh; 
            display: flex;
            flex-direction: column;
            justify-content: center; /* Alinea todo perfectamente al centro vertical */
            align-items: center;
            padding: 40px 24px;
            text-align: center;
            color: #ffffff;
            background-color: #3b2219;
            flex-shrink: 0; 
            gap: 30px; /* Distribución de espacio uniforme entre elementos */
        }

        .text-top {
            font-family: 'Poppins', sans-serif;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-size: 0.9rem;
            margin-bottom: 12px;
            opacity: 0.9;
        }

        .text-names {
            font-family: 'Alex Brush', cursive;
            font-size: 3.6rem;
            font-weight: 400;
            color: #ffffff;
            line-height: 1.2;
        }

        .envelope-wrapper {
            width: 85%;
            max-width: 290px;
            cursor: pointer;
            transition: transform 0.3s ease;
            margin: 10px 0;
        }

        .envelope-wrapper:hover {
            transform: scale(1.04);
        }

        .envelope-img {
            width: 100%;
            height: auto;
            display: block;
        }

        .text-action {
            font-family: 'Bodoni Moda', serif;
            font-style: italic;
            font-size: 1.1rem;
            letter-spacing: 0.5px;
            color: #ffffff;
            text-decoration: none;
            margin-top: 5px;
        }

        /* --- VISTA 2: CONTENIDO PRINCIPAL --- */
        .section-content {
            width: 100%;
            height: 100vh; /* Se mantiene pantalla completa limpia */
            background-color: #ffffff;
            flex-shrink: 0;
            display: flex;
            flex-direction: column; 
        }

        /* Contenedor del Carrusel (Alineado al tope superior sin huecos) */
        .carousel-container {
            position: relative;
            width: 100%;
            flex: 1; /* Absorbe todo el espacio superior hasta la franja café */
            background-color: #eaeaea;
            overflow: hidden;
        }

        .carousel-slide {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover; 
            opacity: 0;
            transition: opacity 0.8s ease-in-out;
        }

        .carousel-slide.active {
            opacity: 1;
        }

        /* Botones del Carrusel */
        .carousel-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255, 255, 255, 0.4);
            border: none;
            color: #000000;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.2rem;
            z-index: 10;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .btn-prev { left: 15px; }
        .btn-next { right: 15px; }

        /* Franja café central con efecto sobrepuesto */
        .date-banner {
            width: 100%;
            height: 150px;
            background-color: #3b2219;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #ffffff;
            position: relative;
            text-align: center;
            flex-shrink: 0;
        }

        .huge-date {
            font-family: 'Poppins', sans-serif;
            font-weight: 700;
            font-size: 3.5rem; 
            letter-spacing: 2px;
            color: rgba(255, 255, 255, 0.23); 
            position: absolute;
            line-height: 1;
            top: 22px;
        }

        .save-the-date-title {
            font-family: 'Alex Brush', cursive;
            font-size: 3.8rem;
            z-index: 2;
            font-weight: 400;
            color: #ffffff;
            text-shadow: 0 2px 10px rgba(0,0,0,0.3); 
            margin-top: 25px;
        }

        /* Altura elástica y colchón de seguridad al fondo para las iniciales */
        .details-banner {
            width: 100%;
            flex: 0 0 auto; 
            padding: 30px 20px 45px 20px; 
            text-align: center;
            background-color: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
        }

        .details-text {
            font-family: 'Poppins', sans-serif;
            color: #3b2219;
            font-size: 1.1rem;
            line-height: 1.6;
            font-weight: 500;
        }

        .footer-wrapper {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .footer-img {
            max-width: 85px;
            height: auto;
            object-fit: contain;
            display: block;
        }
    </style>
</head>
<body>

    <audio id="bg-music" src="musica/cancion.mp3" loop></audio>

    <div class="mobile-container" id="scroll-box">

        <button class="music-btn" id="music-control" onclick="toggleMusic()" title="Reproducir/Pausar música">
            <svg id="icon-playing" viewBox="0 0 24 24">
                <path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/>
            </svg>
            <svg id="icon-muted" viewBox="0 0 24 24" style="display: none;">
                <path d="M4.27 3L3 4.27l9 9v.28c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4v-1.73l4 4L19.73 21 21 19.73 4.27 3zM14 7h4V3h-6v5.18l2 2V7z"/>
            </svg>
        </button>

        <div class="section-envelope">
            <div>
                <p class="text-top">Has recibido un correo de</p>
                <h1 class="text-names">Jacqueline & Mario</h1>
            </div>
            
            <div class="envelope-wrapper" onclick="scrollToContent()">
                <img src="imagenes/sobre.png" alt="Sobre" class="envelope-img">
            </div>
            
            <a href="#" class="text-action" onclick="scrollToContent(); return false;">Haz clic para abrir el mensaje</a>
        </div>

        <div class="section-content" id="invitation-details">
            
            <div class="carousel-container">
                <button class="carousel-btn btn-prev" onclick="changeSlide(-1)">&#10094;</button>
                <img src="imagenes/foto1.jpeg" alt="Foto 1" class="carousel-slide active">
                <img src="imagenes/foto2.jpeg" alt="Foto 2" class="carousel-slide">
                <button class="carousel-btn btn-next" onclick="changeSlide(1)">&#10095;</button>
            </div>

            <div class="date-banner">
                <div class="huge-date">14 . 11 . 2026</div>
                <h2 class="save-the-date-title">Save the date</h2>
            </div>

            <div class="details-banner">
                <div class="details-text">
                    <p>Sábado 14 de noviembre de 2026</p>
                    <p>4:00 pm / San Salvador</p>
                </div>

                <div class="footer-wrapper">
                    <img src="imagenes/iniciales.png" alt="J&M" class="footer-img">
                </div>
            </div>

        </div>

    </div>

    <script>
        const audio = document.getElementById('bg-music');
        const musicBtn = document.getElementById('music-control');
        const iconPlaying = document.getElementById('icon-playing');
        const iconMuted = document.getElementById('icon-muted');
        const scrollBox = document.getElementById('scroll-box');

        // Forzar el scroll hasta el límite físico inferior del contenedor móvil e iniciar música
        function scrollToContent() {
            if (scrollBox) {
                scrollBox.scrollTo({
                    top: scrollBox.scrollHeight, 
                    behavior: 'smooth'
                });
            }
            
            // Iniciar la reproducción musical al interactuar al abrir el sobre
            playAudio();
        }

        // Función para dar play al audio de manera segura
        function playAudio() {
            audio.play().then(() => {
                iconPlaying.style.display = 'block';
                iconMuted.style.display = 'none';
            }).catch(error => {
                console.log("El navegador bloqueó el autoplay inicialmente hasta una interacción completa.");
            });
        }

        // Función manual para el botón de pausar / mutear
        function toggleMusic() {
            if (audio.paused) {
                audio.play();
                iconPlaying.style.display = 'block';
                iconMuted.style.display = 'none';
            } else {
                audio.pause();
                iconPlaying.style.display = 'none';
                iconMuted.style.display = 'block';
            }
        }

        // Cambiar estilo visual del botón flotante según la sección del scroll
        if (scrollBox) {
            scrollBox.addEventListener('scroll', () => {
                // Si el scroll baja más allá de la mitad de la pantalla 1, cambia de estilo para contrastar con el fondo blanco
                if (scrollBox.scrollTop > (window.innerHeight / 2)) {
                    musicBtn.classList.add('black-style');
                } else {
                    musicBtn.classList.remove('black-style');
                }
            });
        }

        // Lógica del carrusel
        let currentIdx = 0;
        const slides = document.querySelectorAll('.carousel-slide');

        function changeSlide(direction) {
            slides[currentIdx].classList.remove('active');
            currentIdx += direction;
            
            if (currentIdx >= slides.length) {
                currentIdx = 0;
            } else if (currentIdx < 0) {
                currentIdx = slides.length - 1;
            }
            
            slides[currentIdx].classList.add('active');
        }

        // Cambio automático cada 4 segundos
        setInterval(() => {
            changeSlide(1);
        }, 4000);
    </script>
</body>
</html>
